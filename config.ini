[Application]
AppName=GPT-9000 Safety Test System
Version=1.0.0

[Fixture]
FixtureName=FIXTURE-001

[Shift]
; Ca ngày / ca đêm dùng để tách báo cáo và thống kê pass rate.
; Report:  Report\<ten CT>\<dd-MM-yyyy>_<Ngay|Dem>Report.csv
; Passrate: passrate\<ten CT>\<dd-MM-yyyy>_<Ngay|Dem>.csv
DayStartHour=8
NightStartHour=20

[Database]
Enabled=false
ServerName=127.0.0.1
DatabaseName=production_test
User=root
Password=
Table=test_results

[Device]
Model=GPT-9801
Interface=RS232
DUT=GPT9800-Arduino

; Cổng serial đọc từ Config\SystemSetting.xml (định dạng giống bản Hipot_GPT9801 cũ).
; GPT-9801        -> ComPortGPT        (mặc định COM2, 115200 8N1)
; Control Board   -> ComPortControl    (AUTO = phần mềm tự dò cổng có board trả lời "OK PONG")
[ControlBoard]
Enabled=true
Port=AUTO
BaudRate=115200
TimeoutMs=2000

[TestProgram]
; Tên file chương trình trong thư mục program\ (ghi đè bởi Config\Program.ini)
ProgramName=program.csv

; Ngưỡng kiểm tra thêm phía phần mềm (máy GPT-9801 tự ngắt theo High/Low set).
; High=0 nghĩa là không giới hạn trên.
[Limits]
ACW_Low=1.00
ACW_High=1.50
Leak_Low=0.0
Leak_High=3.5
IR_Low=100
IR_High=0
GB_Low=0.00
GB_High=0.20

; Hệ số quy đổi số ADC trên Control Board: gia_tri_do = ADC * Scale + Offset
; (dùng cho kênh cảm biến A0..A3, không dùng cho phép thử chính của GPT-9801)
[Scaling]
ACW_Scale=0.0014648
ACW_Offset=0
Leak_Scale=0.0034180
Leak_Offset=0
IR_Scale=0.1953125
IR_Offset=0
GB_Scale=0.0001953
GB_Offset=0

[Security]
SettingsPassword=123456
